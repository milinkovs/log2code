[SERVICE]
    Flush        1
    Log_Level    info

# Docker fluentd logging driver connects here (fluentd-address: localhost:24224).
# Every stdout line of a container arrives as a separate record; multi-line events
# (stack traces) are reassembled later by the ingester (T18), not here.
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# One plain-text file per tag: with no `File` parameter the file name equals the tag,
# so tag "<service>.log" becomes /data/logs/<service>.log. `Template {log}` writes the
# container line unchanged (no JSON envelope).
[OUTPUT]
    Name         file
    Match        *.log
    Path         /data/logs
    Format       template
    Template     {log}
