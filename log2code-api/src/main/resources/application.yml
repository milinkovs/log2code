server:
  port: 8090

spring:
  application:
    name: log2code-api
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # /** is mapped by WebConfig (web build + SPA fallback, T32); it reads static-locations
      add-mappings: false

log2code:
  opensearch:
    url: http://localhost:9200

management:
  endpoints:
    web:
      exposure:
        include: health
