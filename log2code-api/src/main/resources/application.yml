server:
  port: 8090

spring:
  application:
    name: log2code-api
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # /** is mapped by WebConfig (web build + SPA fallback, T32); it reads static-locations
      add-mappings: false

log2code:
  opensearch:
    url: http://localhost:9200
  llm:
    provider: gemini
    base-url: https://generativelanguage.googleapis.com/v1beta
    # empty = "not configured"; the key lives only in infra/.env.local (not in git), see docs/llm-explain.md
    api-key: ${LOG2CODE_GEMINI_API_KEY:}
    # user decision (T42, ADR-041): the lite model answers in ~1 s and is rarely overloaded; 3.8-flash stays selectable
    default-model: gemini-3.5-flash-lite
    models:
      - id: gemini-3.8-flash
        label: Gemini 3.8 Flash
      - id: gemini-3.7-flash
        label: Gemini 3.7 Flash
      - id: gemini-3.5-flash-lite
        label: Gemini 3.5 Flash Lite
    temperature: 0.2
    max-output-tokens: 8192
    connect-timeout: 10s
    request-timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health
