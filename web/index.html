<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>log2code</title>
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors src/theme/themeStore.ts.
      (function () {
        var pref = 'dark';
        try {
          var stored = localStorage.getItem('log2code:theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (e) {}
        if (pref === 'system')
          pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
